<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハウスルール確認・チェックイン / Check-in System</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; background: #f5f5f5; color: #333; }
    .card { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .hidden { display: none; }
    button { background: #007bff; color: white; border: none; padding: 12px 18px; border-radius: 5px; cursor: pointer; margin-top: 15px; width: 100%; font-size: 16px; font-weight: bold; }
    button:hover { background: #0056b3; }
    button:disabled { background: #cccccc; cursor: not-allowed; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .admin-link-btn { width: auto; background: none; color: #888; border: 1px solid #ccc; font-size: 12px; padding: 4px 8px; border-radius: 4px; margin: 0; font-weight: normal; }
    .admin-link-btn:hover { background: #eee; color: #333; }
    .lang-selector { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .lang-btn { width: auto; padding: 6px 12px; font-size: 13px; background: #6c757d; margin: 0; font-weight: normal; }
    .lang-btn.active { background: #28a745; font-weight: bold; }
    input[type="password"], input[type="text"] { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    
    /* PDF表示エリア：余白を抑えて最大化 */
    .viewer-container { display: flex; flex-direction: column; }
    .viewer-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .viewer-header h2 { margin: 0; font-size: 18px; }
    .viewer-header p { margin: 0; font-size: 13px; color: #666; }
    iframe { width: 100%; height: 82vh; min-height: 650px; border: 1px solid #ccc; border-radius: 4px; }
    
    /* サインキャンバス */
    .sign-container { margin: 20px 0 10px; }
    .canvas-wrapper { border: 2px dashed #999; border-radius: 5px; background: #fff; touch-action: none; position: relative; margin-top: 8px; }
    canvas { display: block; width: 100%; height: 180px; cursor: crosshair; }
    .canvas-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
    .btn-clear { width: auto; padding: 6px 14px; font-size: 13px; background: #e0e0e0; color: #333; margin: 0; font-weight: normal; }

    /* クイズ進行 */
    .quiz-progress { font-weight: bold; color: #007bff; margin-bottom: 10px; font-size: 16px; }
    .quiz-option-btn { background: #f8f9fa; color: #333; border: 1px solid #ccc; margin-top: 8px; text-align: left; padding: 12px 15px; }
    .quiz-option-btn:hover { background: #e2e6ea; }

    /* 完了・鍵番号表示 */
    .key-box { background: #e9f5ff; border: 2px dashed #007bff; padding: 20px; text-align: center; border-radius: 6px; margin: 25px 0; }
    .key-number { font-size: 36px; font-weight: bold; color: #d9534f; margin-top: 8px; letter-spacing: 3px; }
    .admin-panel { background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 6px; margin-top: 15px; }
    .btn-secondary { background: #6c757d; }
    .btn-secondary:hover { background: #5a6268; }
    .loading-msg { color: #666; font-size: 14px; text-align: center; }
  </style>
</head>
<body>

<div class="card">
  <!-- ヘッダーバー：管理者ボタン ＆ 4言語切替 -->
  <div class="header-bar">
    <button class="admin-link-btn" onclick="promptAdminLogin()">⚙️ 管理者</button>
    <div class="lang-selector">
      <button class="lang-btn active" id="btn-lang-ja" onclick="setLanguage('ja')">日本語</button>
      <button class="lang-btn" id="btn-lang-en" onclick="setLanguage('en')">English</button>
      <button class="lang-btn" id="btn-lang-zh" onclick="setLanguage('zh')">中文</button>
      <button class="lang-btn" id="btn-lang-ko" onclick="setLanguage('ko')">한국어</button>
    </div>
  </div>

  <!-- 1. トップ画面 -->
  <div id="page-top">
    <h2 id="txt-top-title">宿泊約款・ハウスルール確認</h2>
    <p id="txt-top-desc">暗証番号を入力して開始してください。</p>
    <input type="password" id="user-pin" placeholder="1111">
    <button onclick="unlockUser()" id="btn-top-unlock">ロック解除</button>
  </div>

  <!-- 2. 番号入力画面 -->
  <div id="page-input-id" class="hidden">
    <h2 id="txt-input-title">チェックインコード入力</h2>
    <p id="txt-input-desc">6桁のチェックインコードを入力してください。</p>
    <input type="text" id="user-id-number" placeholder="123456" maxlength="6" inputmode="numeric">
    <button onclick="submitIdNumber()" id="btn-input-next">資料確認へ進む</button>
  </div>

  <!-- 3. PDF資料閲覧画面 -->
  <div id="page-viewer" class="hidden viewer-container">
    <div class="viewer-header">
      <h2 id="txt-viewer-title">ハウスルール・宿泊規約</h2>
      <p id="txt-viewer-desc">内容を確認し、問題へ進んでください。</p>
    </div>
    
    <iframe id="pdf-frame" src=""></iframe>
    
    <button onclick="goToQuiz()" id="btn-viewer-next">内容を確認し、問題へ進む</button>
  </div>

  <!-- 4. 確認クイズ画面 -->
  <div id="page-quiz" class="hidden">
    <h2 id="txt-quiz-title">確認問題</h2>
    <div id="quiz-progress" class="quiz-progress"></div>
    <p id="quiz-question-text" style="font-weight: bold; font-size: 16px;"></p>
    <div id="quiz-options"></div>
  </div>

  <!-- 5. 署名画面 -->
  <div id="page-agreement" class="hidden">
    <h2 id="txt-agree-title">ご署名</h2>
    <p id="txt-agree-desc">全問正解しました。枠内に代表者のお名前（サイン）をご記入ください。</p>

    <!-- サインキャンバス -->
    <div class="sign-container">
      <label><strong id="txt-sign-label">代表者署名（サイン）：</strong></label>
      <div class="canvas-wrapper">
        <canvas id="sign-canvas"></canvas>
      </div>
      <div class="canvas-actions">
        <button type="button" class="btn-clear" onclick="clearCanvas()" id="btn-clear-sign">やり直す</button>
      </div>
    </div>

    <button id="btn-submit-agree" onclick="submitFinalData()" disabled>署名を完了して鍵番号を発行</button>
    <p id="loading-msg" class="loading-msg hidden">データを送信・登録中...</p>
  </div>

  <!-- 6. 完了画面 -->
  <div id="page-complete" class="hidden">
    <h2 id="txt-complete-title">お手続きが完了しました</h2>
    <p id="txt-complete-desc">ご確認およびご署名ありがとうございました。</p>
    
    <div class="key-box">
      <div id="txt-key-label">ご入室用の鍵番号は</div>
      <div class="key-number" id="display-key-number">----</div>
    </div>

    <button onclick="location.reload()" id="btn-complete-reset">最初の画面に戻る</button>
  </div>

  <!-- 7. 管理者専用画面 -->
  <div id="page-admin" class="hidden">
    <h2>管理者設定</h2>
    <div class="admin-panel">
      <p>現在の鍵番号： <strong id="admin-current-key" style="font-size: 22px; color: #d9534f;">取得中...</strong></p>
      <label><strong>新しい鍵番号を入力：</strong></label>
      <input type="text" id="admin-new-key" placeholder="例: 9876">
      <button onclick="updateKeyCodeOnServer()">鍵番号を保存・更新</button>
    </div>
    <button class="btn-secondary" onclick="showPage('page-top')">トップ画面に戻る</button>
  </div>
</div>

<script>
  // --- 施設ごとの設定マップ ---
  const FACILITY_CONFIG = {
    め家: {
      names: { ja: "め家", en: "me-house", zh: "眼房子", ko: "메집" },
      gasUrl: "https://script.google.com/macros/s/AKfycbykzy79ZhvoT451WKKHYbzKU1c8d7Awo4ghJpDRJkhuwr9FZ-woZGxvCMeHwlPFLYlDeQ/exec",
      pdfUrl: "guide_め家.pdf"
    },
    osaka: {
      names: { ja: "大阪施設", en: "Osaka", zh: "大阪设施", ko: "오사카 시설" },
      gasUrl: "https://script.google.com/macros/s/AKfycb_OSAKA_GAS_URL/exec",
      pdfUrl: "guide_osaka.pdf"
    },
    kyoto: {
      names: { ja: "京都施設", en: "Kyoto", zh: "京都设施", ko: "교토 시설" },
      gasUrl: "https://script.google.com/macros/s/AKfycb_KYOTO_GAS_URL/exec",
      pdfUrl: "guide_kyoto.pdf"
    },
    default: {
      names: { ja: "標準施設", en: "Standard facility", zh: "标准设施", ko: "표준 시설" },
      gasUrl: "https://script.google.com/macros/s/AKfycbylu8K9s_RJQlbWVwBesDLUllOZtgw1tsXc7ieLHoTqE7XcThr-lwf_Eq-fnyyMPiMbyg/exec",
      pdfUrl: "guide.pdf"
    }
  };

  // URLパラメータ（?site=xxx）の解析
  const urlParams = new URLSearchParams(window.location.search);
  const siteKey = urlParams.get('site');
  const currentFacility = (siteKey && FACILITY_CONFIG[siteKey]) 
    ? FACILITY_CONFIG[siteKey] 
    : FACILITY_CONFIG.default;

  // 動的エンドポイント＆PDF設定
  const GAS_WEB_APP_URL = currentFacility.gasUrl;
  const SHARED_PDF_URL = currentFacility.pdfUrl;

  // --- 基本設定 ---
  const USER_PIN = "1111"; // お客様用暗証番号
  const QUESTIONS_TO_ASK = 5; // 出題数

  // 4言語辞書
  const DICTIONARY = {
    ja: {

      inputNext: "資料確認へ進む",
      viewerTitle: "ハウスルール・宿泊規約",
      viewerDesc: "内容を確認し、問題へ進んでください。",
      viewerNext: "内容を確認し、問題へ進む",
      quizTitle: "確認問題",
      agreeTitle: "ご署名",
      agreeDesc: "全問正解しました。枠内に代表者のお名前（サイン）をご記入ください。",
      signLabel: "代表者署名（サイン）：",
      clearSign: "やり直す",
      btnSubmit: "署名を完了して鍵番号を発行",
      completeTitle: "お手続きが完了しました",
      completeDesc: "ご確認およびご署名ありがとうございました。",
      keyLabel: "ご入室用の鍵番号は",
      resetBtn: "最初の画面に戻る",
      alertPinErr: "暗証番号が違います。",
      alertIdErr: "6桁の数字（チェックインコード）を入力してください。",
      alertCorrect: "正解です！",
      alertWrong: "不正解です。資料確認ページへ戻りますので内容を再確認してください。",
      progressPrefix: "第 ",
      progressMid: " 問 / 全 ",
      progressSuffix: " 問",
      loadingQuiz: "問題データを読み込み中..."
    },
    en: {
      topTitle: "Terms & House Rules",
      topDesc: "Please enter PIN to start.",
      pinPlaceholder: "Enter PIN (Default: 1111)",
      topUnlock: "Unlock",
      inputTitle: "Check-in Code",
      inputDesc: "Please enter your 6-digit check-in code.",
      inputNext: "Review Guide",
      viewerTitle: "House Rules & Guide",
      viewerDesc: "Please review the guide before taking the quiz.",
      viewerNext: "Confirm & Proceed to Quiz",
      quizTitle: "Confirmation Quiz",
      agreeTitle: "Guest Signature",
      agreeDesc: "All questions cleared! Please provide your signature in the box below.",
      signLabel: "Guest Signature:",
      clearSign: "Clear",
      btnSubmit: "Complete & Get Key Code",
      completeTitle: "Check-in Completed",
      completeDesc: "Thank you for reviewing and providing your signature.",
      keyLabel: "Your Door Lock Code:",
      resetBtn: "Back to Top",
      alertPinErr: "Incorrect PIN.",
      alertIdErr: "Please enter a valid 6-digit code.",
      alertCorrect: "Correct!",
      alertWrong: "Incorrect answer. Returning to guide page for review.",
      progressPrefix: "Question ",
      progressMid: " of ",
      progressSuffix: "",
      loadingQuiz: "Loading questions..."
    },
    zh: {
      topTitle: "住宿条款及守则确认",
      topDesc: "请输入密码开始办理。",
      pinPlaceholder: "输入密码 (初始设置: 1111)",
      topUnlock: "解锁",
      inputTitle: "输入入住码",
      inputDesc: "请输入6位数字入住验证码。",
      inputNext: "查看指南",
      viewerTitle: "入住指南及守则",
      viewerDesc: "请仔细阅读指南，然后进入确认问答。",
      viewerNext: "确认并进入问答",
      quizTitle: "确认问答",

      agreeDesc: "已全部正确回答！请在下方框内完成手写签名。",

    },
    ko: {

      pinPlaceholder: "비밀번호 입력 (기본: 1111)",
      topUnlock: "잠금 해제",
      inputTitle: "체크인 코드 입력",
      inputDesc: "6자리 체크인 코드를 입력해 주세요.",
      inputNext: "안내문 확인하기",
      viewerTitle: "이용 안내 및 규칙",
      viewerDesc: "내용을 확인하신 후 퀴즈로 진행해 주세요.",
      viewerNext: "내용 확인 후 퀴즈 풀기",
      quizTitle: "확인 퀴즈",
      agreeTitle: "서명",
      agreeDesc: "모든 퀴즈를 통과하셨습니다! 아래 상자에 서명을 완료해 주세요.",
      signLabel: "대표자 서명 (사인):",
      clearSign: "지우기",
      btnSubmit: "완료하고 비밀번호 받기",
      completeTitle: "수속이 완료되었습니다",
      completeDesc: "확인 및 서명해 주셔서 감사합니다.",
      keyLabel: "입실 비밀번호는 다음과 같습니다:",
      resetBtn: "처음 화면으로 돌아가기",
      alertPinErr: "비밀번호가 올바르지 않습니다.",
      alertIdErr: "6자리 숫자 코드를 정확히 입력해 주세요.",
      alertCorrect: "정답입니다!",
      alertWrong: "오답입니다. 안내문 페이지로 돌아가 다시 확인해 주세요.",
      progressPrefix: "제 ",
      progressMid: " 번 / 총 ",
      progressSuffix: " 번",
      loadingQuiz: "문제를 불러오는 중..."
    }
  };

  // 状態管理
  let currentLang = 'ja';
  let questionPoolByLang = {};
  let selectedQuizList = [];
  let currentQuizIndex = 0;
  let currentUserIdNumber = "";
  let userQuizAnswers = [];
  let fetchedKeyCode = "----";
  let hasSigned = false;

  // キャンバス署名機能の初期化
  const canvas = document.getElementById('sign-canvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000';
  }

  function startDrawing(e) {
    isDrawing = true;
    hasSigned = true;
    document.getElementById('btn-submit-agree').disabled = false;
    draw(e);
  }

  function stopDrawing() {
    isDrawing = false;
    ctx.beginPath();
  }

  function draw(e) {
    if (!isDrawing) return;
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    const x = clientX - rect.left;
    const y = clientY - rect.top;

    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseleave', stopDrawing);

  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
  canvas.addEventListener('touchend', stopDrawing);

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasSigned = false;
    document.getElementById('btn-submit-agree').disabled = true;
  }

  // 言語切り替え
  function setLanguage(lang) {
    currentLang = lang;
    ['ja', 'en', 'zh', 'ko'].forEach(l => {
      document.getElementById(`btn-lang-${l}`).classList.toggle('active', l === lang);
    });

    const dict = DICTIONARY[lang];
    const facilityName = (currentFacility.names && currentFacility.names[lang]) ? currentFacility.names[lang] : "";
    const prefix = facilityName ? `${facilityName} ` : "";

    document.getElementById('txt-top-title').innerText = `${prefix}${dict.topTitle}`;
    document.getElementById('txt-top-desc').innerText = dict.topDesc;
    document.getElementById('user-pin').placeholder = dict.pinPlaceholder;
    document.getElementById('btn-top-unlock').innerText = dict.topUnlock;
    document.getElementById('txt-input-title').innerText = dict.inputTitle;
    document.getElementById('txt-input-desc').innerText = dict.inputDesc;
    document.getElementById('btn-input-next').innerText = dict.inputNext;
    document.getElementById('txt-viewer-title').innerText = `${prefix}${dict.viewerTitle}`;
    document.getElementById('txt-viewer-desc').innerText = dict.viewerDesc;
    document.getElementById('btn-viewer-next').innerText = dict.viewerNext;
    document.getElementById('txt-quiz-title').innerText = dict.quizTitle;
    document.getElementById('txt-agree-title').innerText = dict.agreeTitle;
    document.getElementById('txt-agree-desc').innerText = dict.agreeDesc;
    document.getElementById('txt-sign-label').innerText = dict.signLabel;
    document.getElementById('btn-clear-sign').innerText = dict.clearSign;
    document.getElementById('btn-submit-agree').innerText = dict.btnSubmit;
    document.getElementById('txt-complete-title').innerText = dict.completeTitle;
    document.getElementById('txt-complete-desc').innerText = dict.completeDesc;
    document.getElementById('txt-key-label').innerText = dict.keyLabel;
    document.getElementById('btn-complete-reset').innerText = dict.resetBtn;

    document.title = `${prefix}${dict.topTitle}`;
    document.getElementById('pdf-frame').src = SHARED_PDF_URL;

    fetchDataFromGAS(lang);
    selectedQuizList = [];
  }

  function showPage(pageId) {
    const pages = ['page-top', 'page-input-id', 'page-viewer', 'page-quiz', 'page-agreement', 'page-complete', 'page-admin'];
    pages.forEach(id => document.getElementById(id).classList.add('hidden'));
    document.getElementById(pageId).classList.remove('hidden');

    if (pageId === 'page-agreement') {
      setTimeout(resizeCanvas, 50);
    }
  }

  function unlockUser() {
    const input = document.getElementById('user-pin').value;
    if (input === USER_PIN) {
      document.getElementById('user-pin').value = '';
      fetchDataFromGAS(currentLang);
      showPage('page-input-id');
    } else {
      alert(DICTIONARY[currentLang].alertPinErr);
    }
  }

  function submitIdNumber() {
    const idNum = document.getElementById('user-id-number').value.trim();
    if (!/^\d{6}$/.test(idNum)) {
      alert(DICTIONARY[currentLang].alertIdErr);
      return;
    }
    currentUserIdNumber = idNum;
    showPage('page-viewer');
  }

  async function fetchDataFromGAS(lang) {
    try {
      const response = await fetch(`${GAS_WEB_APP_URL}?lang=${lang}`);
      const data = await response.json();
      if (data.questions) {
        questionPoolByLang[lang] = data.questions;
      }
      if (data.keyCode) {
        fetchedKeyCode = data.keyCode;
        document.getElementById('display-key-number').innerText = `"${fetchedKeyCode}"`;
      }
    } catch (e) {
      console.error("Fetch Error:", e);
    }
  }

  function goToQuiz() {
    const pool = questionPoolByLang[currentLang];
    if (!pool || pool.length === 0) {
      alert(DICTIONARY[currentLang].loadingQuiz);
      fetchDataFromGAS(currentLang);
      return;
    }
    if (selectedQuizList.length === 0) {
      startQuizSession();
    } else {
      loadQuiz();
    }
    showPage('page-quiz');
  }

  function startQuizSession() {
    const pool = questionPoolByLang[currentLang];
    const shuffled = [...pool].sort(() => 0.5 - Math.random());
    selectedQuizList = shuffled.slice(0, QUESTIONS_TO_ASK);
    currentQuizIndex = 0;
    userQuizAnswers = [];
    loadQuiz();
  }

  function loadQuiz() {
    const q = selectedQuizList[currentQuizIndex];
    const dict = DICTIONARY[currentLang];
    
    document.getElementById('quiz-progress').innerText = 
      `${dict.progressPrefix}${currentQuizIndex + 1}${dict.progressMid}${selectedQuizList.length}${dict.progressSuffix}`;
    document.getElementById('quiz-question-text').innerText = q.question;
    
    const optionsContainer = document.getElementById('quiz-options');
    optionsContainer.innerHTML = '';

    q.options.forEach((opt, index) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-option-btn';
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(index);
      optionsContainer.appendChild(btn);
    });
  }

  function checkAnswer(selectedIndex) {
    const q = selectedQuizList[currentQuizIndex];
    const selectedText = q.options[selectedIndex];
    const dict = DICTIONARY[currentLang];

    if (selectedIndex === q.answer) {
      userQuizAnswers.push({
        question: q.question,
        selected: selectedText
      });

      alert(dict.alertCorrect);
      currentQuizIndex++;
      if (currentQuizIndex < selectedQuizList.length) {
        loadQuiz();
      } else {
        showPage('page-agreement');
      }
    } else {
      alert(dict.alertWrong);
      showPage('page-viewer');
    }
  }

  async function submitFinalData() {
    const signatureData = canvas.toDataURL('image/png');
    
    document.getElementById('loading-msg').classList.remove('hidden');
    document.getElementById('btn-submit-agree').disabled = true;

    try {
      await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          date: new Date().toLocaleString('ja-JP'),
          language: currentLang,
          idNumber: currentUserIdNumber,
          agreed: true,
          signature: signatureData,
          answers: userQuizAnswers
        })
      });
    } catch (e) {
      console.error("Save Error:", e);
    }

    document.getElementById('loading-msg').classList.add('hidden');
    document.getElementById('display-key-number').innerText = `"${fetchedKeyCode}"`;
    showPage('page-complete');
  }

  async function promptAdminLogin() {
    const pass = prompt("管理者パスワードを入力してください:");
    if (!pass) return;

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: "verifyAdmin",
          inputPin: pass.trim()
        })
      });
      const result = await response.json();
      if (result.status === "success") {
        fetchedKeyCode = result.currentKey;
        document.getElementById('admin-current-key').innerText = `"${fetchedKeyCode}"`;
        document.getElementById('admin-new-key').value = '';
        showPage('page-admin');
      } else {
        alert(result.message || "パスワードが違います。");
      }
    } catch (e) {
      alert("認証通信エラー: " + e);
    }
  }

  async function updateKeyCodeOnServer() {
    const newKey = document.getElementById('admin-new-key').value.trim();
    if (!newKey) {
      alert("新しい鍵番号を入力してください。");
      return;
    }

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: "updateKey",
          newKeyCode: newKey
        })
      });
      const res = await response.json();
      if (res.status === "success") {
        fetchedKeyCode = newKey;
        document.getElementById('admin-current-key').innerText = `"${fetchedKeyCode}"`;
        document.getElementById('display-key-number').innerText = `"${fetchedKeyCode}"`;
        alert(`鍵番号を「${newKey}」に更新しました。`);
        showPage('page-top');
      } else {
        alert("更新失敗: " + res.message);
      }
    } catch (e) {
      alert("通信エラー: " + e);
    }
  }

  setLanguage('ja');
  window.addEventListener('resize', resizeCanvas);
</script>
</body>
</html>
