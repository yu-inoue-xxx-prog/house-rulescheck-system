<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in System</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 8px; background: #f5f5f5; color: #333; }
    .card { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); transition: max-width 0.2s; }
    /* PDF閲覧時のみカードを画面幅いっぱいに拡張 */
    .card.wide-mode { max-width: 98vw; padding: 12px 16px; }
    .hidden { display: none !important; }
    
    button { background: #007bff; color: white; border: none; padding: 14px 18px; border-radius: 6px; cursor: pointer; margin-top: 15px; width: 100%; font-size: 16px; font-weight: bold; }
    button:hover { background: #0056b3; }
    button:disabled { background: #cccccc; cursor: not-allowed; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .sub-link-btn { width: auto; background: none; color: #666; border: 1px solid #ccc; font-size: 12px; padding: 6px 12px; border-radius: 4px; margin: 0; font-weight: normal; }
    .sub-link-btn:hover { background: #eee; color: #333; }

    /* 1. 言語選択画面（画面中央・縦4つ並び） */
    .lang-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 65vh; text-align: center; padding: 10px 0; }
    .lang-screen h2 { margin-bottom: 6px; font-size: 22px; }
    .lang-screen p { color: #666; font-size: 14px; margin-bottom: 24px; }
    .lang-vertical-list { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 360px; }
    .lang-choice-btn { margin: 0; padding: 18px 20px; font-size: 18px; background: #ffffff; color: #333; border: 2px solid #007bff; border-radius: 8px; transition: all 0.15s; }
    .lang-choice-btn:hover, .lang-choice-btn:active { background: #007bff; color: #ffffff; }

    input[type="password"], input[type="text"] { width: 100%; padding: 14px; margin: 8px 0; box-sizing: border-box; font-size: 18px; border: 1px solid #ccc; border-radius: 6px; }
    
    /* PDF表示エリア：画面いっぱいに最大化 */
    .viewer-container { display: flex; flex-direction: column; }
    .viewer-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; flex-wrap: wrap; gap: 4px; }
    .viewer-header h2 { margin: 0; font-size: 18px; }
    .viewer-header p { margin: 0; font-size: 13px; color: #666; }
    iframe { width: 100%; height: calc(100vh - 145px); min-height: 650px; border: 1px solid #ccc; border-radius: 4px; background: #eee; }
    #btn-viewer-next { margin-top: 10px; padding: 14px; }
    
    /* サインキャンバス */
    .sign-container { margin: 20px 0 10px; }
    .canvas-wrapper { border: 2px dashed #999; border-radius: 5px; background: #fff; touch-action: none; position: relative; margin-top: 8px; }
    canvas { display: block; width: 100%; height: 180px; cursor: crosshair; }
    .canvas-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
    .btn-clear { width: auto; padding: 6px 14px; font-size: 13px; background: #e0e0e0; color: #333; margin: 0; font-weight: normal; }

    /* クイズ進行 */
    .quiz-progress { font-weight: bold; color: #007bff; margin-bottom: 10px; font-size: 16px; }
    .quiz-option-btn { background: #f8f9fa; color: #333; border: 1px solid #ccc; margin-top: 10px; text-align: left; padding: 14px 16px; font-weight: normal; }
    .quiz-option-btn:hover { background: #e2e6ea; }

    /* 完了・鍵番号表示 */
    .key-box { background: #e9f5ff; border: 2px dashed #007bff; padding: 24px; text-align: center; border-radius: 6px; margin: 25px 0; }
    .key-number { font-size: 38px; font-weight: bold; color: #d9534f; margin-top: 8px; letter-spacing: 3px; }
    .admin-panel { background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 6px; margin-top: 15px; }
    .btn-secondary { background: #6c757d; }
    .btn-secondary:hover { background: #5a6268; }
    .loading-msg { color: #666; font-size: 14px; text-align: center; }
  </style>
</head>
<body>

<div class="card" id="main-card">
  <!-- 上部バー -->
  <div class="header-bar">
    <button type="button" class="sub-link-btn" onclick="promptAdminLogin()">⚙️ 管理者</button>
    <button type="button" class="sub-link-btn hidden" id="btn-back-lang" onclick="resetToLanguageSelect()">🌐 Language / 言語</button>
  </div>

  <!-- 1. 言語選択画面 -->
  <div id="page-lang" class="lang-screen">
    <h2 id="txt-lang-facility">Check-in / チェックイン</h2>
    <p>Please select your language / 言語を選択してください</p>
    <div class="lang-vertical-list">
      <button type="button" class="lang-choice-btn" onclick="selectLanguageAndStart('ja')">日本語</button>
      <button type="button" class="lang-choice-btn" onclick="selectLanguageAndStart('en')">English</button>
      <button type="button" class="lang-choice-btn" onclick="selectLanguageAndStart('zh')">中文</button>
      <button type="button" class="lang-choice-btn" onclick="selectLanguageAndStart('ko')">한국어</button>
    </div>
  </div>

  <!-- 2. ロック解除画面 -->
  <div id="page-top" class="hidden">
    <h2 id="txt-top-title">ロック解除</h2>
    <p id="txt-top-desc">暗証番号を入力して開始してください。</p>
    <input type="password" id="user-pin" placeholder="1111" inputmode="numeric">
    <button type="button" onclick="unlockUser()" id="btn-top-unlock">ロック解除</button>
  </div>

  <!-- 3. 6桁コード入力画面 -->
  <div id="page-input-id" class="hidden">
    <h2 id="txt-input-title">チェックインコード入力</h2>
    <p id="txt-input-desc">6桁のチェックインコードを入力してください。</p>
    <input type="text" id="user-id-number" placeholder="123456" maxlength="6" inputmode="numeric">
    <button type="button" onclick="submitIdNumber()" id="btn-input-next">資料確認へ進む</button>
  </div>

  <!-- 4. ハウスルール確認画面 -->
  <div id="page-viewer" class="hidden viewer-container">
    <div class="viewer-header">
      <h2 id="txt-viewer-title">ハウスルール・宿泊規約</h2>
      <p id="txt-viewer-desc">内容を確認し、問題へ進んでください。</p>
    </div>
    <iframe id="pdf-frame" src="about:blank"></iframe>
    <button type="button" onclick="goToQuiz()" id="btn-viewer-next">内容を確認し、問題へ進む</button>
  </div>

  <!-- 5. 確認クイズ画面 -->
  <div id="page-quiz" class="hidden">
    <h2 id="txt-quiz-title">確認問題</h2>
    <div id="quiz-progress" class="quiz-progress"></div>
    <p id="quiz-question-text" style="font-weight: bold; font-size: 17px;"></p>
    <div id="quiz-options"></div>
  </div>

  <!-- 6. 確認の署名画面 -->
  <div id="page-agreement" class="hidden">
    <h2 id="txt-agree-title">ご署名</h2>
    <p id="txt-agree-desc">全問正解しました。枠内に代表者のお名前（サイン）をご記入ください。</p>

    <div class="sign-container">
      <label><strong id="txt-sign-label">代表者署名（サイン）：</strong></label>
      <div class="canvas-wrapper">
        <canvas id="sign-canvas"></canvas>
      </div>
      <div class="canvas-actions">
        <button type="button" class="btn-clear" onclick="clearCanvas()" id="btn-clear-sign">やり直す</button>
      </div>
    </div>

    <button type="button" id="btn-submit-agree" onclick="submitFinalData()" disabled>署名を完了して鍵番号を発行</button>
    <p id="loading-msg" class="loading-msg hidden">データを送信・登録中...</p>
  </div>

  <!-- 7. 鍵番号の表示（完了）画面 -->
  <div id="page-complete" class="hidden">
    <h2 id="txt-complete-title">お手続きが完了しました</h2>
    <p id="txt-complete-desc">ご確認およびご署名ありがとうございました。</p>
    
    <div class="key-box">
      <div id="txt-key-label">ご入室用の鍵番号は</div>
      <div class="key-number" id="display-key-number">----</div>
    </div>

    <button type="button" onclick="location.reload()" id="btn-complete-reset">最初の画面に戻る</button>
  </div>

  <!-- 管理者専用画面 -->
  <div id="page-admin" class="hidden">
    <h2>管理者設定</h2>
    <div class="admin-panel">
      <p>現在の鍵番号： <strong id="admin-current-key" style="font-size: 22px; color: #d9534f;">取得中...</strong></p>
      <label><strong>新しい鍵番号を入力：</strong></label>
      <input type="text" id="admin-new-key" placeholder="例: 9876">
      <button type="button" onclick="updateKeyCodeOnServer()">鍵番号を保存・更新</button>
    </div>
    <button type="button" class="btn-secondary" onclick="resetToLanguageSelect()">最初の画面に戻る</button>
  </div>
</div>

      resetBtn: "처음 화면으로 돌아가기",
      alertPinErr: "비밀번호가 올바르지 않습니다.",
      alertIdErr: "6자리 숫자 코드를 정확히 입력해 주세요.",
      alertCorrect: "정답입니다!",
      alertWrong: "오답입니다. 안내문 페이지로 돌아가 다시 확인해 주세요.",
      progressPrefix: "제 ",
      progressMid: " 번 / 총 ",
      progressSuffix: " 번",
      loadingQuiz: "문제를 불러오는 중... 잠시 후 다시 눌러주세요."

  let currentLang = 'ja';
  let questionPoolByLang = {};
  let selectedQuizList = [];
  let currentQuizIndex = 0;
  let currentUserIdNumber = "";
  let userQuizAnswers = [];
  let fetchedKeyCode = "----";
  let hasSigned = false;

  const canvas = document.getElementById('sign-canvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;

  function resizeCanvas() {
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0) return;
    canvas.width = rect.width;
    canvas.height = rect.height;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000';
  }

  function startDrawing(e) {
    isDrawing = true;
    hasSigned = true;
    document.getElementById('btn-submit-agree').disabled = false;
    draw(e);
  }

  function stopDrawing() {
    isDrawing = false;
    ctx.beginPath();
  }

  function draw(e) {
    if (!isDrawing) return;
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    const x = clientX - rect.left;
    const y = clientY - rect.top;

    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseleave', stopDrawing);
  canvas.addEventListener('touchstart', function(e) { e.preventDefault(); startDrawing(e); }, { passive: false });
  canvas.addEventListener('touchmove', function(e) { e.preventDefault(); draw(e); }, { passive: false });
  canvas.addEventListener('touchend', stopDrawing);

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasSigned = false;
    document.getElementById('btn-submit-agree').disabled = true;
  }

  function showPage(pageId) {
    const pages = ['page-lang', 'page-top', 'page-input-id', 'page-viewer', 'page-quiz', 'page-agreement', 'page-complete', 'page-admin'];
    for (let i = 0; i < pages.length; i++) {
      const el = document.getElementById(pages[i]);
      if (el) el.classList.add('hidden');
    }
    const target = document.getElementById(pageId);
    if (target) target.classList.remove('hidden');

    // PDF閲覧時のみ外枠を画面幅いっぱいに拡張
    const mainCard = document.getElementById('main-card');
    if (mainCard) {
      if (pageId === 'page-viewer') {
        mainCard.classList.add('wide-mode');
      } else {
        mainCard.classList.remove('wide-mode');
      }
    }

    const backLangBtn = document.getElementById('btn-back-lang');
    if (backLangBtn) {
      if (pageId === 'page-lang') {
        backLangBtn.classList.add('hidden');
      } else {
        backLangBtn.classList.remove('hidden');
      }
    }

    // PDF閲覧画面を開いたときだけ、横幅フィット倍率(#view=FitH&navpanes=0)を付けて読み込み
    const pdfFrame = document.getElementById('pdf-frame');
    if (pdfFrame) {
      if (pageId === 'page-viewer') {
        const optimizedPdfUrl = SHARED_PDF_URL + "#view=FitH&navpanes=0";
        if (pdfFrame.getAttribute('src') !== optimizedPdfUrl) {
          pdfFrame.setAttribute('src', optimizedPdfUrl);
        }
      } else {
        pdfFrame.setAttribute('src', 'about:blank');
      }
    }

    if (pageId === 'page-agreement') {
      setTimeout(resizeCanvas, 50);
    }
    window.scrollTo(0, 0);
  }

  function selectLanguageAndStart(lang) {
    applyLanguage(lang);
    showPage('page-top');
  }

  function resetToLanguageSelect() {
    document.getElementById('user-pin').value = '';
    document.getElementById('user-id-number').value = '';
    selectedQuizList = [];
    clearCanvas();
    showPage('page-lang');
  }

  function applyLanguage(lang) {
    currentLang = lang;
    const dict = DICTIONARY[lang] || DICTIONARY.ja;
    const facilityName = (currentFacility.names && currentFacility.names[lang]) ? currentFacility.names[lang] : "";
    const prefix = facilityName ? (facilityName + " ") : "";

    document.getElementById('txt-top-title').innerText = prefix + dict.topTitle;
    document.getElementById('txt-top-desc').innerText = dict.topDesc;
    document.getElementById('user-pin').placeholder = dict.pinPlaceholder;
    document.getElementById('btn-top-unlock').innerText = dict.topUnlock;
    
    document.getElementById('txt-input-title').innerText = prefix + dict.inputTitle;
    document.getElementById('txt-input-desc').innerText = dict.inputDesc;
    document.getElementById('btn-input-next').innerText = dict.inputNext;
    
    document.getElementById('txt-viewer-title').innerText = prefix + dict.viewerTitle;
    document.getElementById('txt-viewer-desc').innerText = dict.viewerDesc;
    document.getElementById('btn-viewer-next').innerText = dict.viewerNext;
    
    document.getElementById('txt-quiz-title').innerText = prefix + dict.quizTitle;
    
    document.getElementById('txt-agree-title').innerText = prefix + dict.agreeTitle;
    document.getElementById('txt-agree-desc').innerText = dict.agreeDesc;
    document.getElementById('txt-sign-label').innerText = dict.signLabel;
    document.getElementById('btn-clear-sign').innerText = dict.clearSign;
    document.getElementById('btn-submit-agree').innerText = dict.btnSubmit;
    
    document.getElementById('txt-complete-title').innerText = prefix + dict.completeTitle;
    document.getElementById('txt-complete-desc').innerText = dict.completeDesc;
    document.getElementById('txt-key-label').innerText = dict.keyLabel;
    document.getElementById('btn-complete-reset').innerText = dict.resetBtn;

    document.title = prefix + dict.viewerTitle;

    fetchDataFromGAS(lang);
    selectedQuizList = [];
  }

  function unlockUser() {
    const input = document.getElementById('user-pin').value;
    if (input === USER_PIN) {
      document.getElementById('user-pin').value = '';
      fetchDataFromGAS(currentLang);
      showPage('page-input-id');
    } else {
      alert(DICTIONARY[currentLang].alertPinErr);
    }
  }

  function submitIdNumber() {
    const idNum = document.getElementById('user-id-number').value.trim();
    if (!/^\d{6}$/.test(idNum)) {
      alert(DICTIONARY[currentLang].alertIdErr);
      return;
    }
    currentUserIdNumber = idNum;
    showPage('page-viewer');
  }

  async function fetchDataFromGAS(lang) {
    try {
      const response = await fetch(GAS_WEB_APP_URL + "?lang=" + lang);
      const data = await response.json();
      if (data.questions) {
        questionPoolByLang[lang] = data.questions;
      }
      if (data.keyCode) {
        fetchedKeyCode = data.keyCode;
        document.getElementById('display-key-number').innerText = '"' + fetchedKeyCode + '"';
      }
    } catch (e) {
      console.error("Fetch Error:", e);
    }
  }

  function goToQuiz() {
    const pool = questionPoolByLang[currentLang];
    if (!pool || pool.length === 0) {
      alert(DICTIONARY[currentLang].loadingQuiz);
      fetchDataFromGAS(currentLang);
      return;
    }
    if (selectedQuizList.length === 0) {
      startQuizSession();
    } else {
      loadQuiz();
    }
    showPage('page-quiz');
  }

  function startQuizSession() {
    const pool = questionPoolByLang[currentLang];
    const shuffled = pool.slice().sort(function() { return 0.5 - Math.random(); });
    selectedQuizList = shuffled.slice(0, QUESTIONS_TO_ASK);
    currentQuizIndex = 0;
    userQuizAnswers = [];
    loadQuiz();
  }

  function loadQuiz() {
    const q = selectedQuizList[currentQuizIndex];
    const dict = DICTIONARY[currentLang];
    
    document.getElementById('quiz-progress').innerText = 
      dict.progressPrefix + (currentQuizIndex + 1) + dict.progressMid + selectedQuizList.length + dict.progressSuffix;
    document.getElementById('quiz-question-text').innerText = q.question;
    
    const optionsContainer = document.getElementById('quiz-options');
    optionsContainer.innerHTML = '';

    q.options.forEach(function(opt, index) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'quiz-option-btn';
      btn.innerText = opt;
      btn.onclick = function() { checkAnswer(index); };
      optionsContainer.appendChild(btn);
    });
  }

  function checkAnswer(selectedIndex) {
    const q = selectedQuizList[currentQuizIndex];
    const selectedText = q.options[selectedIndex];
    const dict = DICTIONARY[currentLang];

    if (selectedIndex === q.answer) {
      userQuizAnswers.push({
        question: q.question,
        selected: selectedText
      });

      alert(dict.alertCorrect);
      currentQuizIndex++;
      if (currentQuizIndex < selectedQuizList.length) {
        loadQuiz();
      } else {
        showPage('page-agreement');
      }
    } else {
      alert(dict.alertWrong);
      showPage('page-viewer');
    }
  }

  async function submitFinalData() {
    const signatureData = canvas.toDataURL('image/png');
    
    document.getElementById('loading-msg').classList.remove('hidden');
    document.getElementById('btn-submit-agree').disabled = true;

    try {
      await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          date: new Date().toLocaleString('ja-JP'),
          language: currentLang,
          idNumber: currentUserIdNumber,
          agreed: true,
          signature: signatureData,
          answers: userQuizAnswers
        })
      });
    } catch (e) {
      console.error("Save Error:", e);
    }

    document.getElementById('loading-msg').classList.add('hidden');
    document.getElementById('display-key-number').innerText = '"' + fetchedKeyCode + '"';
    showPage('page-complete');
  }

  async function promptAdminLogin() {
    const pass = prompt("管理者パスワードを入力してください:");
    if (!pass) return;

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: "verifyAdmin",
          inputPin: pass.trim()
        })
      });
      const result = await response.json();
      if (result.status === "success") {
        fetchedKeyCode = result.currentKey;
        document.getElementById('admin-current-key').innerText = '"' + fetchedKeyCode + '"';
        document.getElementById('admin-new-key').value = '';
        showPage('page-admin');
      } else {
        alert(result.message || "パスワードが違います。");
      }
    } catch (e) {
      alert("認証通信エラー: " + e);
    }
  }

  async function updateKeyCodeOnServer() {
    const newKey = document.getElementById('admin-new-key').value.trim();
    if (!newKey) {
      alert("新しい鍵番号を入力してください。");
      return;
    }

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: "updateKey",
          newKeyCode: newKey
        })
      });
      const res = await response.json();
      if (res.status === "success") {
        fetchedKeyCode = newKey;
        document.getElementById('admin-current-key').innerText = '"' + fetchedKeyCode + '"';
        document.getElementById('display-key-number').innerText = '"' + fetchedKeyCode + '"';
        alert("鍵番号を「" + newKey + "」に更新しました。");
        resetToLanguageSelect();
      } else {
        alert("更新失敗: " + res.message);
      }
    } catch (e) {
      alert("通信エラー: " + e);
    }
  }

  // 初期実行
  const jaFacility = (currentFacility.names && currentFacility.names.ja) ? currentFacility.names.ja : "";
  if (jaFacility) {
    document.getElementById('txt-lang-facility').innerText = jaFacility + " - Check-in";
  }
  showPage('page-lang');
  window.addEventListener('resize', resizeCanvas);
</script>
</body>
</html>
